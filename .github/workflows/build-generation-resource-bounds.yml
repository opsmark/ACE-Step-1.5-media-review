name: Build generation resource boundaries

on:
  push:
    branches:
      - security/generation-resource-bounds-20261012

permissions:
  contents: write

jobs:
  build-qualify-seal:
    if: ${{ !contains(github.event.head_commit.message, '[generation-bounds-sealed]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4
        with:
          ref: security/generation-resource-bounds-20261012
          fetch-depth: 0

      - name: Set up supported Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused test dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            'pydantic>=2,<3' 'fastapi>=0.110' 'starlette>=0.36' \
            'loguru>=0.7' 'uvicorn>=0.27' 'httpx>=0.27' 'python-multipart>=0.0.18'

      - name: Apply bounded source transform
        run: python .github/scripts/apply_generation_resource_bounds.py

      - name: Compile changed sources
        run: |
          python -m compileall -q \
            acestep/api/generation_resource_policy.py \
            acestep/api/generation_resource_policy_test.py \
            acestep/openrouter_models.py \
            acestep/openrouter_adapter.py \
            acestep/api/http/release_task_models.py \
            acestep/api/jobs/store.py \
            acestep/api/jobs/worker_loops.py \
            acestep/api/job_execution_runtime.py \
            acestep/api/job_blocking_generation.py \
            acestep/core/generation/handler/task_utils.py \
            acestep/ui/gradio/api/api_routes.py

      - name: Run focused and parent authentication checks
        run: |
          set -o pipefail
          python -m unittest -v \
            acestep.api.generation_resource_policy_test \
            acestep.api.http.authenticated_router_test \
            acestep.api.server_cli_test \
            acestep.api.jobs.store_test \
            acestep.api.jobs.worker_loops_test \
            2>&1 | tee /tmp/generation-resource-tests.txt

      - name: Verify source shape and hygiene
        run: |
          git diff --check
          grep -n 'read_json_object_limited(request)' acestep/openrouter_adapter.py
          grep -n 'validate_openrouter_request' acestep/openrouter_adapter.py
          grep -n 'request_cancel' acestep/openrouter_adapter.py
          grep -n 'await _read_api_payload(request)' acestep/ui/gradio/api/api_routes.py
          grep -n 'LIMITS.max_duration_seconds' acestep/core/generation/handler/task_utils.py
          ! grep -n 'body = await request.json()' acestep/openrouter_adapter.py

      - name: Write qualification receipt safely
        env:
          RUN_ID: ${{ github.run_id }}
          BASE_SHA: 1bb0cf9d1356c9153459e4572210c6a6b2d8d963
        run: python .github/scripts/write_generation_resource_receipt.py /tmp/generation-resource-tests.txt

      - name: Seal candidate without one-shot builders
        run: |
          rm -f .github/scripts/apply_generation_resource_bounds.py
          rm -f .github/scripts/write_generation_resource_receipt.py
          rm -f .github/workflows/build-generation-resource-bounds.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '[generation-bounds-sealed] Bound generation ingress and work'
          git push origin HEAD:security/generation-resource-bounds-20261012
