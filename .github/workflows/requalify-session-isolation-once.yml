# final requalification after Windows alias diagnostic 38228853043
name: requalify-session-isolation-once

on:
  push:
    branches:
      - security/gradio-session-artifact-isolation-20261012
    paths:
      - .github/workflows/requalify-session-isolation-once.yml

permissions:
  contents: write

jobs:
  core-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up supported Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Compile changed source
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q \
            acestep/acestep_v15_pipeline.py \
            acestep/ui/gradio/session_artifact_scope.py \
            acestep/ui/gradio/session_artifact_state.py \
            acestep/ui/gradio/events/results/batch_management_background.py \
            acestep/ui/gradio/events/results/batch_management_wrapper.py \
            acestep/ui/gradio/events/results/generation_progress.py \
            acestep/ui/gradio/events/results/lrc_utils.py \
            acestep/ui/gradio/events/training/dataset_ops.py \
            acestep/ui/gradio/events/training/preprocess.py \
            acestep/ui/gradio/events/training/session_access.py
      - name: Run focused source and behavior checks
        shell: bash
        run: |
          set -euo pipefail
          python acestep/ui/gradio/session_artifact_scope_test.py
          python acestep/ui/gradio/events/training/session_access_test.py
          python acestep/ui/gradio/session_isolation_source_test.py
          python acestep/ui/gradio/events/results/batch_management_test.py
          python acestep/ui/gradio/events/results/batch_management_background_test.py
          git diff --check

  gradio-framework-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up supported Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install exact Gradio runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input 'gradio==6.2.0'
      - name: Prove per-client state and file serving
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/gradio_session_probe.py <<'PY'
          import os
          import re
          import tempfile
          import wave
          from pathlib import Path
          from unittest.mock import patch

          import gradio as gr
          from gradio_client import Client

          from acestep.ui.gradio.session_artifact_scope import (
              SessionArtifactAccessError,
              allocate_session_batch_directory,
              authorize_session_artifact_path,
              resolve_session_artifact_scope,
          )
          from acestep.ui.gradio.session_artifact_state import SessionArtifactScopeState
          import acestep.ui.gradio.session_artifact_scope as scope_module

          temp = tempfile.TemporaryDirectory()
          root = Path(temp.name)
          results = root / 'gradio_outputs'
          sessions = results / 'sessions'
          patches = [
              patch.object(scope_module, 'DEFAULT_RESULTS_DIR', str(results)),
              patch.object(scope_module, 'SESSION_RESULTS_DIR', str(sessions)),
          ]
          for item in patches:
              item.start()

          def make_audio(state):
              token = resolve_session_artifact_scope(state)
              _, batch = allocate_session_batch_directory(token)
              path = Path(batch) / 'probe.wav'
              with wave.open(str(path), 'wb') as handle:
                  handle.setnchannels(1)
                  handle.setsampwidth(2)
                  handle.setframerate(8000)
                  handle.writeframes(b'\x00\x00' * 80)
              return token, str(path), str(path)

          def authorize(state, raw_path):
              try:
                  return authorize_session_artifact_path(raw_path, state, must_exist=True)
              except SessionArtifactAccessError:
                  return 'DENIED'

          with gr.Blocks() as demo:
              state = gr.State(value=SessionArtifactScopeState())
              raw = gr.Textbox()
              token = gr.Textbox()
              audio = gr.Audio()
              decision = gr.Textbox()
              make = gr.Button()
              check = gr.Button()
              make.click(make_audio, inputs=[state], outputs=[token, raw, audio], api_name='make')
              check.click(authorize, inputs=[state, raw], outputs=[decision], api_name='authorize')

          _app, local_url, _share = demo.launch(
              server_name='127.0.0.1',
              server_port=7869,
              prevent_thread_lock=True,
              quiet=True,
              allowed_paths=None,
          )
          try:
              first = Client(local_url, verbose=False)
              second = Client(local_url, verbose=False)
              first_token, first_raw, first_audio = first.predict(api_name='/make')
              first_token_again, second_raw_same_client, second_audio = first.predict(api_name='/make')
              second_token, second_raw, third_audio = second.predict(api_name='/make')

              assert re.fullmatch(r'[A-Za-z0-9_-]{43}', first_token)
              assert first_token == first_token_again
              assert first_token != second_token
              assert first_raw != second_raw_same_client
              assert Path(first_raw).exists()
              assert Path(second_raw).exists()
              own = first.predict(first_raw, api_name='/authorize')
              assert os.path.samefile(first_raw, own)
              assert second.predict(first_raw, api_name='/authorize') == 'DENIED'
              for result in (first_audio, second_audio, third_audio):
                  assert result is not None
              print('GRADIO_SESSION_STATE=PASS')
              print('GRADIO_FILE_OUTPUT_WITHOUT_GLOBAL_ALLOWED_PATH=PASS')
              print('CROSS_SESSION_PATH_AUTHORIZATION=DENIED')
          finally:
              demo.close()
              for item in reversed(patches):
                  item.stop()
              temp.cleanup()
          PY
          PYTHONPATH="$PWD" python /tmp/gradio_session_probe.py

  seal-requalification:
    needs: [core-tests, gradio-framework-test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out qualified branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Append framework and Windows receipt
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor f26289f4351469085a583b4e616d2018deb3df26 HEAD
          test -f .github/workflows/requalify-session-isolation-once.yml
          cat >> docs/evidence/SECURITY_GRADIO_SESSION_ISOLATION_20261012.md <<EOF

          ## Framework and Windows requalification

          The failed runs remain evidence rather than being relabeled. Run 38228229421 exposed Windows path-spelling assumptions, a candidate link escape, and a missing import path in the disposable Gradio probe. Runs 38228695767 and 38228757246 passed the Gradio integration but still failed the Windows link case. Diagnostic run 38228853043 established the cause: Windows supplied the configured temporary root through an 8.3 alias while generated paths used the long alias, so managed-path recognition returned early even though the final entry was a real symlink/reparse point.

          The candidate now compares both lexical and resolved path candidates against both lexical and canonical generated-root aliases before applying session containment and link/reparse-point rejection. GitHub Actions run ${GITHUB_RUN_ID} completed the focused suites and compile checks on CPython 3.11 for both Ubuntu and Windows. Path-equivalence tests compare actual files rather than platform-specific slash spelling.

          A separate exact Gradio 6.2.0 loopback probe created two independent clients. Repeated calls by one client retained one server-side opaque scope; the second client received a different scope. Each client generated and received a valid audio file while global generated-output allowed_paths remained disabled. The first client authorized its own raw artifact path, while the second client was denied that same path. This is a disposable framework integration check, not the target full ACE-Step UI, authentication deployment, GPU generation, Internet exposure, retention policy or production outcome.
          EOF
          rm .github/workflows/requalify-session-isolation-once.yml
          git diff --check
      - name: Seal requalification
        shell: bash
        env:
          BRANCH: security/gradio-session-artifact-isolation-20261012
        run: |
          set -euo pipefail
          git config user.name "opsmark"
          git config user.email "rass991@gmail.com"
          git add -A
          git commit -m "test: seal cross-platform session isolation evidence"
          git push origin "HEAD:${BRANCH}"
