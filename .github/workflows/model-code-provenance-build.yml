name: Build model-code provenance candidate

on:
  push:
    branches:
      - security/model-code-provenance-20261011
    paths:
      - .github/workflows/model-code-provenance-build.yml

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Set up supported Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Apply bounded source transformation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, expected: int = 1) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected:
                  raise SystemExit(
                      f"{path}: expected {expected} occurrence(s), observed {count}"
                  )
              target.write_text(text.replace(old, new), encoding="utf-8")

          loader = "acestep/core/generation/handler/init_service_loader.py"
          replace_exact(loader, "        from transformers import AutoModel\n\n", "")
          replace_exact(
              loader,
              "                self.model = AutoModel.from_pretrained(\n"
              "                    model_checkpoint_path,\n"
              "                    trust_remote_code=True,\n"
              "                    attn_implementation=candidate,\n"
              "                    dtype=self.dtype,\n"
              "                )",
              "                from acestep.api.trusted_model_loader import (\n"
              "                    load_trusted_dit_model,\n"
              "                )\n"
              "\n"
              "                model_id = os.path.basename(\n"
              "                    os.path.normpath(model_checkpoint_path)\n"
              "                )\n"
              "                self.model = load_trusted_dit_model(\n"
              "                    model_checkpoint_path,\n"
              "                    model_id=model_id,\n"
              "                    attn_implementation=candidate,\n"
              "                    dtype=self.dtype,\n"
              "                )",
          )

          llm = "acestep/llm_inference.py"
          replace_exact(
              llm,
              "            self.llm = AutoModelForCausalLM.from_pretrained(model_path, trust_remote_code=True)",
              "            from acestep.api.trusted_model_loader import (\n"
              "                load_trusted_causal_lm,\n"
              "            )\n"
              "\n"
              "            self.llm = load_trusted_causal_lm(model_path)",
          )
          replace_exact(
              llm,
              "                self._hf_model_for_scoring = AutoModelForCausalLM.from_pretrained(\n"
              "                    model_path,\n"
              "                    trust_remote_code=True,\n"
              "                    torch_dtype=self.dtype\n"
              "                )",
              "                from acestep.api.trusted_model_loader import (\n"
              "                    load_trusted_causal_lm,\n"
              "                )\n"
              "\n"
              "                self._hf_model_for_scoring = load_trusted_causal_lm(\n"
              "                    model_path,\n"
              "                    torch_dtype=self.dtype,\n"
              "                )",
              expected=2,
          )
          replace_exact(
              llm,
              "            llm_tokenizer = AutoTokenizer.from_pretrained(full_lm_model_path, use_fast=True)",
              "            llm_tokenizer = AutoTokenizer.from_pretrained(\n"
              "                full_lm_model_path,\n"
              "                use_fast=True,\n"
              "                local_files_only=True,\n"
              "            )",
          )

          tests = "acestep/api/trusted_model_loader_test.py"
          replace_exact(
              tests,
              "        self.assertIs(_RecordingConfig.calls[0][0][0], _RecordingModel.calls[0][0][0])",
              "        self.assertEqual(_RecordingConfig.calls[0][0][0], _RecordingModel.calls[0][0][0])",
          )
          replace_exact(
              tests,
              "        self.assertIn(\"load_trusted_causal_lm\", lm_source)\n"
              "        self.assertNotIn(",
              "        self.assertIn(\"load_trusted_causal_lm\", lm_source)\n"
              "        self.assertNotIn(\"trust_remote_code=True\", lm_source)\n"
              "        self.assertNotIn(",
          )
          replace_exact(
              tests,
              "        self.assertIn(\n"
              "            \"AutoTokenizer.from_pretrained(full_lm_model_path, use_fast=True, local_files_only=True)\",\n"
              "            lm_source,\n"
              "        )",
              "        self.assertIn(\"local_files_only=True\", lm_source)",
          )
          PY
      - name: Verify bounded diff and source policy
        run: |
          git diff --check
          test "$(grep -R --fixed-strings -c 'trust_remote_code=True' \
            acestep/core/generation/handler/init_service_loader.py \
            acestep/llm_inference.py | awk -F: '{sum += $2} END {print sum+0}')" = "0"
          grep -q "load_trusted_dit_model" acestep/core/generation/handler/init_service_loader.py
          grep -q "load_trusted_causal_lm" acestep/llm_inference.py
      - name: Run focused tests
        run: |
          python -m compileall -q \
            acestep/api/trusted_model_loader.py \
            acestep/core/generation/handler/init_service_loader.py \
            acestep/llm_inference.py
          python -m unittest -v acestep.api.trusted_model_loader_test
      - name: Commit generated candidate
        run: |
          git config user.name "opsmark"
          git config user.email "rass991@gmail.com"
          git add \
            acestep/api/trusted_model_loader_test.py \
            acestep/core/generation/handler/init_service_loader.py \
            acestep/llm_inference.py
          git diff --cached --quiet && {
            echo "No candidate changes were generated" >&2
            exit 1
          }
          git commit -m "security: load models through application-owned classes"
          git push origin HEAD:security/model-code-provenance-20261011
