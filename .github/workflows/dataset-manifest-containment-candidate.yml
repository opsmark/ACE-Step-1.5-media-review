name: Dataset manifest containment candidate

on:
  push:
    branches:
      - security/dataset-manifest-containment-20261011

permissions:
  contents: write

concurrency:
  group: dataset-manifest-containment-candidate
  cancel-in-progress: false

jobs:
  qualify-and-seal:
    if: ${{ !contains(github.event.head_commit.message, '[dataset-manifest-fix-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up supported Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check loguru

      - name: Apply exact sink wiring
        run: python .github/apply_dataset_preprocess_patch.py

      - name: Compile changed Python sources
        run: |
          python -m compileall -q \
            acestep/training/dataset_builder_modules/dataset_path_safety.py \
            acestep/training/dataset_builder_modules/models.py \
            acestep/training/dataset_builder_modules/core.py \
            acestep/training/dataset_builder_modules/scan.py \
            acestep/training/dataset_builder_modules/serialization.py \
            acestep/training/dataset_builder_modules/preprocess.py \
            acestep/training/dataset_builder_modules/dataset_manifest_path_security_test.py \
            acestep/training/dataset_builder_modules/dataset_manifest_source_integration_test.py

      - name: Run focused behavioral and wiring tests
        run: |
          python -m unittest -v \
            acestep.training.dataset_builder_modules.dataset_manifest_path_security_test \
            acestep.training.dataset_builder_modules.dataset_manifest_source_integration_test

      - name: Verify clean patch shape
        run: |
          git diff --check
          ! grep -F 'os.path.join(output_dir, f"{sample.id}.pt")' \
            acestep/training/dataset_builder_modules/preprocess.py
          ! grep -F 'torch.save(output_data, output_path)' \
            acestep/training/dataset_builder_modules/preprocess.py

      - name: Record qualification receipt
        run: |
          mkdir -p docs/security
          cat > docs/security/DATASET_MANIFEST_CONTAINMENT_20261011.md <<EOF
          # Dataset manifest containment qualification — 2026-10-11

          GitHub Actions run: ${GITHUB_RUN_ID}
          Base branch at construction: main
          Candidate branch: ${GITHUB_REF_NAME}
          Runtime: CPython 3.11 on ubuntu-latest

          The run applied an exact-match source transformation, compiled every changed Python file, and passed the focused dataset manifest behavioral and source-integration tests before this receipt was committed.

          Scope: imported sample IDs, embedded audio paths, approved audio roots, duplicate IDs, symlink escapes, canonical tensor destinations, and atomic same-directory tensor writes.

          Limits: no real decoder, GPU model, training job, production dataset, Windows junction/reparse-point or fleet installation was exercised. The candidate remains unmerged and undeployed until the receiving owner performs native qualification.
          EOF

      - name: Remove one-shot builder and workflow
        run: |
          rm -f .github/apply_dataset_preprocess_patch.py
          rm -f .github/workflows/dataset-manifest-containment-candidate.yml

      - name: Commit sealed candidate
        run: |
          git config user.name opsmark
          git config user.email rass991@gmail.com
          git add -A
          git commit -m 'security: contain imported dataset manifest paths [dataset-manifest-fix-applied]'
          git push origin HEAD:${GITHUB_REF_NAME}
