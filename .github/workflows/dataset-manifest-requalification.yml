name: Dataset manifest containment requalification

on:
  push:
    branches:
      - security/dataset-manifest-containment-20261011

permissions:
  contents: write

concurrency:
  group: dataset-manifest-containment-requalification
  cancel-in-progress: false

jobs:
  requalify-and-seal:
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up supported Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check loguru

      - name: Compile changed Python sources
        run: |
          python -m compileall -q \
            acestep/training/dataset_builder_modules/dataset_path_safety.py \
            acestep/training/dataset_builder_modules/models.py \
            acestep/training/dataset_builder_modules/core.py \
            acestep/training/dataset_builder_modules/scan.py \
            acestep/training/dataset_builder_modules/serialization.py \
            acestep/training/dataset_builder_modules/preprocess.py \
            acestep/training/dataset_builder_modules/dataset_manifest_path_security_test.py \
            acestep/training/dataset_builder_modules/dataset_manifest_source_integration_test.py \
            acestep/training/dataset_builder_modules/dataset_serialization_commit_test.py

      - name: Run 20 focused behavioral and wiring checks
        run: |
          python - <<'PY'
          import importlib.util
          import pathlib
          import sys
          import types
          import unittest

          root = pathlib.Path.cwd()
          package_paths = {
              "acestep": root / "acestep",
              "acestep.training": root / "acestep" / "training",
              "acestep.training.dataset_builder_modules": (
                  root / "acestep" / "training" / "dataset_builder_modules"
              ),
          }
          for name, path in package_paths.items():
              package = types.ModuleType(name)
              package.__path__ = [str(path)]
              package.__package__ = name
              sys.modules[name] = package

          def load(name, path):
              spec = importlib.util.spec_from_file_location(name, path)
              module = importlib.util.module_from_spec(spec)
              sys.modules[name] = module
              spec.loader.exec_module(module)
              return module

          module_dir = package_paths["acestep.training.dataset_builder_modules"]
          load(
              "acestep.training.path_safety",
              package_paths["acestep.training"] / "path_safety.py",
          )
          load(
              "acestep.training.dataset_builder_modules.dataset_path_safety",
              module_dir / "dataset_path_safety.py",
          )
          load(
              "acestep.training.dataset_builder_modules.models",
              module_dir / "models.py",
          )
          load(
              "acestep.training.dataset_builder_modules.serialization",
              module_dir / "serialization.py",
          )
          behavior = load(
              "acestep.training.dataset_builder_modules.dataset_manifest_path_security_test",
              module_dir / "dataset_manifest_path_security_test.py",
          )
          integration = load(
              "acestep.training.dataset_builder_modules.dataset_manifest_source_integration_test",
              module_dir / "dataset_manifest_source_integration_test.py",
          )
          commit_boundary = load(
              "acestep.training.dataset_builder_modules.dataset_serialization_commit_test",
              module_dir / "dataset_serialization_commit_test.py",
          )

          suite = unittest.TestSuite()
          loader = unittest.defaultTestLoader
          for module in (behavior, integration, commit_boundary):
              suite.addTests(loader.loadTestsFromModule(module))
          if suite.countTestCases() != 20:
              raise SystemExit(f"Expected 20 focused checks, found {suite.countTestCases()}")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY

      - name: Verify candidate and repository hygiene
        run: |
          git diff --check
          test ! -e .github/apply_dataset_preprocess_patch.py
          test ! -e .github/workflows/dataset-manifest-containment-candidate.yml
          ! grep -F 'os.path.join(output_dir, f"{sample.id}.pt")' \
            acestep/training/dataset_builder_modules/preprocess.py
          ! grep -F 'torch.save(output_data, output_path)' \
            acestep/training/dataset_builder_modules/preprocess.py

      - name: Replace qualification receipt
        run: |
          cat > docs/security/DATASET_MANIFEST_CONTAINMENT_20261011.md <<EOF
          # Dataset manifest containment qualification — 2026-10-11/12

          Base branch at construction: \`main\` at \`ca1e85fe9430179831e6bc6be790c332190a3866\`  
          Candidate branch: \`security/dataset-manifest-containment-20261011\`  
          Runtime: CPython 3.11.17 on \`ubuntu-latest\`

          ## Preserved execution history

          - Initial construction run \`38191371120\` applied the bounded preprocess transformation and compiled every changed source, then failed because ordinary package import pulled the optional PyTorch dependency into a focused path-only test environment. It did not promote the candidate.
          - Construction run \`38191434864\` isolated the focused modules, passed 17 behavioral/source checks, removed its one-shot builder/workflow, and sealed the first candidate commit.
          - Requalification run \`${GITHUB_RUN_ID}\` passed 20 checks after metadata publication was moved behind the successful atomic manifest replacement. Validation failure and synthetic durable-write failure both preserved the builder's complete prior metadata.

          ## Qualified source boundary

          The candidate enforces strict portable sample identifiers, canonical approved audio roots, manifest size/sample ceilings, duplicate-ID rejection, symlink and cross-root refusal, decode-time path revalidation, canonical tensor destinations, and same-directory atomic tensor/manifest replacement. Manifest data cannot declare a broader trusted root. Failed manifest import and failed save preserve the prior in-memory builder state.

          ## Limits

          This is source-tested candidate evidence, not merge, deployment or scanner closure. No real decoder, GPU model, training job, production dataset, Windows junction/reparse-point behavior, filesystem ACL policy, fleet installation or user outcome was exercised. Existing datasets that reference audio outside the manifest directory now require an explicit trusted \`audio_root\` or administrator \`ACESTEP_DATASET_AUDIO_ROOT\` configuration.
          EOF

      - name: Remove this one-shot workflow and seal receipt
        run: |
          rm -f .github/workflows/dataset-manifest-requalification.yml
          git config user.name opsmark
          git config user.email rass991@gmail.com
          git add -A
          git commit -m 'test: requalify dataset manifest commit boundary [dataset-manifest-requalified]'
          git push origin HEAD:${GITHUB_REF_NAME}
