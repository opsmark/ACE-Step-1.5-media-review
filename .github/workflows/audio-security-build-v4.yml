name: Complete bounded audio ingress qualification and seal

on:
  push:
    branches:
      - security/bounded-audio-ingress-20261012
    paths:
      - .github/workflows/audio-security-build-v4.yml

permissions:
  contents: write

concurrency:
  group: bounded-audio-ingress-construction-v4
  cancel-in-progress: false

env:
  PATCH_SHA256: 8a317d75cb90d77104f24b1dff188cd6896bf49b899d83dcf0ddd92264cea77b

jobs:
  qualify-and-seal:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/bounded-audio-ingress-20261012
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconstruct exact reviewed patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, os
          root = Path('.ops-build/audio_patch_chunks')
          names = [
              'chunk_00', 'chunk_01',
              'repair_02_0', 'repair_02_1',
              'repair_03_0', 'repair_03_1',
              'chunk_04',
              'repair_05_0_part_0', 'repair_05_0_part_1', 'repair_05_1',
              'chunk_06',
          ]
          pieces = {name: bytearray((root / name).read_bytes()) for name in names}
          pieces['repair_05_0_part_0'][1825] = ord('w')
          pieces['repair_05_0_part_1'][281] = ord('w')
          pieces['repair_05_0_part_1'][817] = ord('w')
          patch = base64.b64decode(b''.join(bytes(pieces[name]) for name in names), validate=True)
          actual = hashlib.sha256(patch).hexdigest()
          assert actual == os.environ['PATCH_SHA256'], actual
          Path('audio-security.patch').write_bytes(patch)
          print('patch_bytes', len(patch), 'sha256', actual)
          PY
          git apply --check audio-security.patch
          git apply audio-security.patch
          rm audio-security.patch
      - name: Repeat focused qualification on supported Python
        shell: bash
        run: |
          python acestep/core/generation/handler/audio_input_limits_test.py -v
          python -m compileall -q \
            acestep/acestep_v15_pipeline.py \
            acestep/core/generation/handler/audio_input_limits.py \
            acestep/core/generation/handler/io_audio.py \
            acestep/ui/gradio/events/generation/validation.py \
            acestep/core/generation/handler/audio_input_limits_test.py
          git diff --check
      - name: Install only the missing integration dependencies
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          python -m pip install --disable-pip-version-check --no-input 'soundfile==0.13.1'
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - name: Exercise real WAV, AAC and tightened-duration paths
        shell: bash
        run: |
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          ffmpeg -hide_banner -loglevel error -f lavfi -i 'sine=frequency=440:sample_rate=44100' -t 1 -c:a pcm_s16le "$tmpdir/tone.wav"
          ffmpeg -hide_banner -loglevel error -f lavfi -i 'sine=frequency=440:sample_rate=44100' -t 1 -c:a aac "$tmpdir/tone.m4a"
          AUDIO_TEST_TMP="$tmpdir" python - <<'PY'
          import importlib.util, os, sys
          from pathlib import Path
          path = Path('acestep/core/generation/handler/audio_input_limits.py')
          spec = importlib.util.spec_from_file_location('audio_limits_real_integration', path)
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          assert spec.loader is not None
          spec.loader.exec_module(module)
          root = Path(os.environ['AUDIO_TEST_TMP'])
          wav = module.validate_audio_file_limits(str(root / 'tone.wav'))
          assert wav.probe == 'soundfile' and wav.channels == 1
          assert 0.9 <= wav.duration_seconds <= 1.1
          original_info = module.sf.info
          try:
              module.sf.info = lambda _path: (_ for _ in ()).throw(RuntimeError('force ffprobe path'))
              aac = module.validate_audio_file_limits(str(root / 'tone.m4a'))
          finally:
              module.sf.info = original_info
          assert aac.probe == 'ffprobe' and aac.channels == 1
          assert 0.9 <= aac.duration_seconds <= 1.2
          tighter = module.AudioInputLimits(
              max_file_bytes=module.ABSOLUTE_MAX_AUDIO_FILE_BYTES,
              max_duration_seconds=0.5,
              max_sample_rate=module.ABSOLUTE_MAX_AUDIO_SAMPLE_RATE,
              max_channels=module.ABSOLUTE_MAX_AUDIO_CHANNELS,
              max_decoded_samples=module.ABSOLUTE_MAX_DECODED_SAMPLES,
          )
          try:
              module.validate_audio_file_limits(str(root / 'tone.wav'), tighter)
          except module.AudioInputLimitError:
              pass
          else:
              raise AssertionError('duration ceiling did not reject real WAV metadata')
          print('REAL_AUDIO_METADATA_CANARY_PASS')
          PY
      - name: Seal source branch and remove one-shot transport
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p docs/evidence
          cat > docs/evidence/SECURITY_BOUNDED_AUDIO_INGRESS_QUALIFICATION_20261012.md <<EOF
          # Bounded audio ingress qualification — 2026-10-12

          Status: SOURCE_TESTED / CROSS_PLATFORM_FOCUSED / DRAFT / UNMERGED / UNDEPLOYED

          Codex Security finding: \`csf_d576fc10819cdf621fcc765a\`.
          Frozen base: \`ca1e85fe9430179831e6bc6be790c332190a3866\`.
          Reviewed patch SHA-256: \`${PATCH_SHA256}\`.
          Final Ubuntu qualification and sealing run: \`${RUN_ID}\`.
          Windows focused qualification passed in preserved run \`38246035522\`.

          ## Qualified behavior

          - Gradio rejects uploads above a central 256 MiB ceiling before temporary-file storage.
          - Pre-decode policy limits file bytes, duration, sample rate, channels and decoded samples. Environment values may tighten but cannot widen compiled ceilings.
          - Metadata uses \`soundfile.info\` or a shell-free five-second \`ffprobe\` argv fallback.
          - Both native decode paths receive a one-frame-over ceiling; actual decoder output and projected 48 kHz stereo resampling are rechecked before allocation-heavy downstream work.
          - Rejected source/reference uploads are cleared with the existing localized warning.
          - Nineteen focused checks, compilation and diff checks passed on CPython 3.11 under Ubuntu and Windows.
          - A real one-second PCM WAV passed the soundfile metadata path; a real AAC/M4A passed the forced ffprobe path; a tightened half-second duration policy refused the one-second WAV.

          ## Preserved failures and corrections

          The first package-level Base44 test imported optional PyTorch and failed before the focused module because PyTorch was unavailable. The isolated harness later found and corrected a mono-to-stereo resampling undercount. Initial GitHub runs failed before source qualification because manually transported patch segments were incomplete; exact per-segment hashes exposed the transport fault. Three one-byte substitutions in the last affected segment were repaired at documented offsets and the full patch hash was reverified. Run \`38246035522\` then passed patch reconstruction and all focused checks on Ubuntu and Windows; only its Ubuntu real-media step failed because the runner image did not include ffmpeg/ffprobe. This final run installed that missing test dependency and reran the real-media canary. No failed run was relabeled as a first-pass success.

          ## Limits and receiving gate

          This branch is unmerged and undeployed. It did not run the target Windows installation, real GPU generation, every codec, production proxy limits, concurrent abusive uploads, retention, per-principal quotas or OS-level enforcement. It reduces the reported resource-amplification path but does not certify arbitrary media or eliminate every parser flaw or filesystem race.

          Before merge/deployment: inventory legitimate audio and non-audio upload sizes; run target-environment tests; exercise trusted WAV/MP3/AAC/M4A source, reference, cover and repaint generation; verify over-limit refusal precedes full decode, tensor allocation, resampling, model initialization and GPU work; test proxy/body ceilings and concurrency; preserve rollback; close the finding only after deployed runtime readback.
          EOF
          git rm -r .ops-build/audio_patch_chunks \
            .github/workflows/audio-security-build.yml \
            .github/workflows/audio-security-build-v2.yml \
            .github/workflows/audio-security-build-v3.yml \
            .github/workflows/audio-security-build-v4.yml
          git add \
            acestep/acestep_v15_pipeline.py \
            acestep/core/generation/handler/audio_input_limits.py \
            acestep/core/generation/handler/audio_input_limits_test.py \
            acestep/core/generation/handler/io_audio.py \
            acestep/ui/gradio/events/generation/validation.py \
            docs/evidence/SECURITY_BOUNDED_AUDIO_INGRESS_QUALIFICATION_20261012.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Security: bound audio uploads before decode'
          git push origin HEAD:security/bounded-audio-ingress-20261012
