name: diagnose-windows-link-once

on:
  push:
    branches:
      - security/gradio-session-artifact-isolation-20261012
    paths:
      - .github/workflows/diagnose-windows-link-once.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Inspect actual Windows symlink and path walk
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" python - <<'PY'
          import os
          import stat
          import tempfile
          from pathlib import Path
          from unittest.mock import patch
          import acestep.ui.gradio.session_artifact_scope as scope

          with tempfile.TemporaryDirectory() as tmp:
              tmp_path = Path(tmp)
              results = tmp_path / 'gradio_outputs'
              sessions = results / 'sessions'
              with patch.object(scope, 'DEFAULT_RESULTS_DIR', str(results)), patch.object(scope, 'SESSION_RESULTS_DIR', str(sessions)):
                  token, batch = scope.allocate_session_batch_directory(None)
                  outside = tmp_path / 'outside.wav'
                  outside.write_bytes(b'outside')
                  link = Path(batch) / 'escape.wav'
                  link.symlink_to(outside)
                  info = os.lstat(link)
                  print('LINK=', link)
                  print('OUTSIDE=', outside)
                  print('EXISTS=', os.path.exists(link))
                  print('LEXISTS=', os.path.lexists(link))
                  print('PATH_IS_SYMLINK=', link.is_symlink())
                  print('OS_ISLINK=', os.path.islink(link))
                  print('READLINK=', os.readlink(link))
                  print('REALPATH=', os.path.realpath(link))
                  print('MODE=', info.st_mode)
                  print('S_ISLNK=', stat.S_ISLNK(info.st_mode))
                  print('FILE_ATTRIBUTES=', getattr(info, 'st_file_attributes', None))
                  print('REPARSE_FLAG=', getattr(stat, 'FILE_ATTRIBUTE_REPARSE_POINT', None))
                  print('HELPER=', scope._stat_is_link_or_reparse(info))
                  raw = scope._absolute(link)
                  root = scope.session_artifact_root(token, create=False)
                  root_raw = os.path.abspath(root)
                  relative = os.path.relpath(raw, root_raw)
                  print('RAW=', raw)
                  print('ROOT_RAW=', root_raw)
                  print('RELATIVE=', relative)
                  print('PARTS=', Path(relative).parts)
                  current = root_raw
                  for part in Path(relative).parts:
                      current = os.path.join(current, part)
                      print('COMPONENT=', current, 'LEXISTS=', os.path.lexists(current))
                      if os.path.lexists(current):
                          component_info = os.lstat(current)
                          print('COMPONENT_MODE=', component_info.st_mode, 'ATTR=', getattr(component_info, 'st_file_attributes', None), 'HELPER=', scope._stat_is_link_or_reparse(component_info))
                  try:
                      answer = scope.authorize_session_artifact_path(link, token)
                      print('AUTHORIZE=ALLOWED', answer)
                  except Exception as exc:
                      print('AUTHORIZE=REJECTED', type(exc).__name__, str(exc))
          PY
      - name: Remove one-shot diagnostic
        shell: bash
        env:
          BRANCH: security/gradio-session-artifact-isolation-20261012
        run: |
          set -euo pipefail
          git config user.name "opsmark"
          git config user.email "rass991@gmail.com"
          rm .github/workflows/diagnose-windows-link-once.yml
          git add -A
          git commit -m "ci: remove Windows link diagnostic"
          git push origin "HEAD:${BRANCH}"
