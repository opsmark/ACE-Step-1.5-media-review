name: apply-session-isolation-once

on:
  push:
    branches:
      - security/gradio-session-artifact-isolation-20261012
    paths:
      - .github/workflows/apply-session-isolation-once.yml

permissions:
  contents: write

jobs:
  apply-test-seal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact carrier branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Verify carrier identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "ca6d8a2d8b134436a28930fa86753a1089ef9a75"
          test -f .github/session_isolation_patch.xz.b64.part01
          test -f .github/session_isolation_patch.xz.b64.part02
          test -f .github/workflows/source-export-once.yml

      - name: Reconstruct and apply reviewed source patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/session_isolation_patch.xz.b64.part01 \
            .github/session_isolation_patch.xz.b64.part02 \
            | base64 -d | xz -dc > /tmp/session-isolation.full.patch
          echo "173c1a7f336059bedc86667d293ce756eba6e37e1e389c9185e1fac70d0483a7  /tmp/session-isolation.full.patch" | sha256sum -c -
          sed -n '/^diff --git baseline\/acestep\/acestep_v15_pipeline.py /,$p' \
            /tmp/session-isolation.full.patch > /tmp/session-isolation.code.patch
          test -s /tmp/session-isolation.code.patch
          git apply --check -p1 /tmp/session-isolation.code.patch
          git apply -p1 /tmp/session-isolation.code.patch
          rm -f \
            .github/session_isolation_patch.xz.b64.part01 \
            .github/session_isolation_patch.xz.b64.part02 \
            .github/workflows/source-export-once.yml \
            .github/workflows/apply-session-isolation-once.yml

      - name: Compile changed source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q \
            acestep/acestep_v15_pipeline.py \
            acestep/ui/gradio/session_artifact_scope.py \
            acestep/ui/gradio/session_artifact_state.py \
            acestep/ui/gradio/events/results/batch_management_background.py \
            acestep/ui/gradio/events/results/batch_management_wrapper.py \
            acestep/ui/gradio/events/results/generation_progress.py \
            acestep/ui/gradio/events/results/lrc_utils.py \
            acestep/ui/gradio/events/training/dataset_ops.py \
            acestep/ui/gradio/events/training/preprocess.py \
            acestep/ui/gradio/events/training/session_access.py \
            acestep/ui/gradio/events/wiring/generation_run_wiring.py \
            acestep/ui/gradio/events/wiring/training_dataset_builder_wiring.py \
            acestep/ui/gradio/events/wiring/training_dataset_preprocess_wiring.py \
            acestep/ui/gradio/interfaces/__init__.py

      - name: Run focused behavioral and wiring checks
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/session-isolation-tests.log
          for test_file in \
            acestep/ui/gradio/session_artifact_scope_test.py \
            acestep/ui/gradio/events/training/session_access_test.py \
            acestep/ui/gradio/session_isolation_source_test.py \
            acestep/ui/gradio/events/results/batch_management_test.py \
            acestep/ui/gradio/events/results/batch_management_background_test.py
          do
            echo "=== ${test_file} ===" | tee -a /tmp/session-isolation-tests.log
            python3 "${test_file}" 2>&1 | tee -a /tmp/session-isolation-tests.log
          done
          test_count="$(grep -Eo 'Ran [0-9]+ tests?' /tmp/session-isolation-tests.log | awk '{sum += $2} END {print sum + 0}')"
          test "${test_count}" -ge 25
          echo "TEST_COUNT=${test_count}" | tee /tmp/session-isolation-count.txt
          git diff --check

      - name: Write bounded qualification receipt
        shell: bash
        run: |
          set -euo pipefail
          test_count="$(cut -d= -f2 /tmp/session-isolation-count.txt)"
          observed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p docs/evidence
          cat > docs/evidence/SECURITY_GRADIO_SESSION_ISOLATION_20261012.md <<EOF
          # Gradio session artifact isolation — source qualification

          - Observed: ${observed_at}
          - Scanner finding: csf_8001dc958463ac7625456278
          - Frozen source base: ca1e85fe9430179831e6bc6be790c332190a3866
          - Reviewed carrier head: ca6d8a2d8b134436a28930fa86753a1089ef9a75
          - Reconstructed patch SHA-256: 173c1a7f336059bedc86667d293ce756eba6e37e1e389c9185e1fac70d0483a7
          - Focused checks: ${test_count} passed; compileall and git diff --check passed.

          ## Qualified source behavior

          Generated audio, sidecars, repaint latents and automatic subtitle files are placed beneath one opaque server-side Gradio session scope. Foreground and AutoGen background generation retain the same scope. Training scan, preview, load, save and preprocessing reject generated artifacts owned by another session. The application no longer publishes the complete generated-output tree through Gradio allowed_paths, and administrator-provided allowed paths may not overlap that tree.

          ## Limits and receiving gate

          This is source-only evidence. The branch is not merged, installed or deployed; the scanner finding remains open. No real GPU generation, full Gradio server, browser pair, Windows filesystem, uploaded production media, authentication deployment, retention policy or user outcome was exercised here. Before adoption, run two authenticated browser sessions against the target supported environment; verify each can generate, preview and train from its own output but cannot enumerate or fetch the other session's media; exercise AutoGen, automatic LRC, page refresh, normal external datasets, explicit allowed paths, cleanup/retention and rollback; then compare the installed revision and preserve the prior files.
          EOF

      - name: Seal candidate branch
        shell: bash
        env:
          BRANCH: security/gradio-session-artifact-isolation-20261012
        run: |
          set -euo pipefail
          git config user.name "opsmark"
          git config user.email "rass991@gmail.com"
          git add -A
          test -n "$(git status --short)"
          git commit -m "security: isolate Gradio artifacts by session"
          git push origin "HEAD:${BRANCH}"
