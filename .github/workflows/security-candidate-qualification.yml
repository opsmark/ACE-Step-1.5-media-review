name: Security candidate qualification

on:
  push:
    branches:
      - security/candidate-qualification-20261011
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-lightweight:
    name: ${{ matrix.name }} (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API authentication boundary
            ref: security/auth-boundary-hardening-20261010
            dependencies: fastapi==0.128.2 starlette==0.50.0 httpx==0.28.1 uvicorn==0.48.0
            command: python -m unittest -v acestep.api.server_cli_test acestep.api.http.authenticated_router_test
          - name: Queue admission atomicity
            ref: security/queue-admission-atomicity-20261011
            dependencies: fastapi==0.128.2 starlette==0.50.0 httpx==0.28.1
            command: python -m unittest -v acestep.api.http.release_task_admission_test
          - name: Training export containment
            ref: security/training-export-containment-20261011
            dependencies: loguru==0.7.3
            command: python -m unittest -v acestep.api.training_export_service_test
          - name: Model selector containment
            ref: security/model-selector-containment-20261011
            dependencies: loguru==0.7.3
            command: python -m unittest -v acestep.api.model_selection_security_test
          - name: TensorBoard loopback
            ref: security/tensorboard-loopback-20261011
            dependencies: ""
            command: python -m unittest -v acestep.api.runtime_helpers_security_test
          - name: Authentication before body parsing
            ref: security/prebody-auth-20261011
            dependencies: fastapi==0.128.2 starlette==0.50.0 httpx==0.28.1
            command: python -m unittest -v acestep.api.http.prebody_auth_test
          - name: Official launch boundaries
            ref: security/official-launch-boundaries-20261011
            dependencies: pyyaml==6.0.3
            command: >-
              python -m compileall -q acestep/network_exposure.py acestep/secure_gradio_entrypoint.py openrouter/__init__.py openrouter/secure_server.py
              && python -m unittest -v acestep.launch_security_test
              && bash -n run_api_server.sh
              && bash -n run_openrouter_api_server.sh
              && docker compose config >/dev/null
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - name: Set up supported Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install focused dependencies
        if: matrix.dependencies != ''
        run: python -m pip install --disable-pip-version-check ${{ matrix.dependencies }}
      - name: Run focused qualification
        run: ${{ matrix.command }}

  lokr-data-only-resume:
    name: LoKr data-only resume (Python 3.11 / CPU PyTorch)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: security/lokr-data-only-resume-20261011
          persist-credentials: false
      - name: Set up supported Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install CPU test dependencies
        run: |
          python -m pip install --disable-pip-version-check loguru==0.7.3
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run data-only loader and integration tests
        run: >-
          python -m unittest -v
          acestep.training_v2.training_state_safety_test
          acestep.training_v2.trainer_helpers_lokr_resume_security_test

  simplemv-no-shell:
    name: SimpleMV no-shell execution (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: security/simplemv-no-shell-20261011
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Run focused security tests
        run: node --test .claude/skills/acestep-simplemv/scripts/process-runner.test.mjs
