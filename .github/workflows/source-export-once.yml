name: source-export-once

on:
  push:
    branches:
      - security/gradio-session-artifact-isolation-20261012
    paths:
      - .github/workflows/source-export-once.yml

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
      - name: Record source identity
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee SOURCE_COMMIT.txt
          git status --short
      - name: Upload reviewed source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: gradio-session-isolation-source
          path: |
            .
            !.git
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
