# =============================================================================
# ACE-Step 1.5 — Docker Compose (generic CUDA)
# =============================================================================
#
# Usage:
#   docker compose up              # Start Gradio UI (default)
#   docker compose up --build      # Build and start
#   docker compose up -d           # Run in background
#   docker compose down            # Stop
#   docker compose logs -f         # View logs
#
#   # Start REST API server instead (ACESTEP_API_KEY is required because the
#   # service must bind to the container interface for Docker forwarding):
#   ACESTEP_MODE=api ACESTEP_API_KEY='replace-me' docker compose up
#
# By default the published host ports bind only to 127.0.0.1. To expose them
# beyond the host, set ACESTEP_DOCKER_BIND_ADDRESS deliberately and configure
# the corresponding Gradio username/password and/or API key first.
# =============================================================================

services:
  acestep:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/ace-step/ace-step-1.5:latest
    container_name: acestep

    # ---- GPU access ----
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    # ---- Environment ----
    env_file:
      - path: .env
        required: false
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - ACESTEP_MODE=${ACESTEP_MODE:-gradio}
      - ACESTEP_LLM_BACKEND=${ACESTEP_LLM_BACKEND:-pt}
      - ACESTEP_INIT_SERVICE=${ACESTEP_INIT_SERVICE:-true}
      - ACESTEP_CONFIG_PATH=${ACESTEP_CONFIG_PATH:-acestep-v15-turbo}
      - ACESTEP_LM_MODEL_PATH=${ACESTEP_LM_MODEL_PATH:-acestep-5Hz-lm-4B}
      - ACESTEP_EXTRA_ARGS=${ACESTEP_EXTRA_ARGS:-}
      - ACESTEP_GRADIO_USERNAME=${ACESTEP_GRADIO_USERNAME:-}
      - ACESTEP_GRADIO_PASSWORD=${ACESTEP_GRADIO_PASSWORD:-}
      - ACESTEP_API_KEY=${ACESTEP_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      # The application binds the container interface, while the declared host
      # publication below is loopback-only by default. The secure Gradio
      # launcher accepts this boundary only while the published address itself
      # remains loopback.
      - ACESTEP_TRUST_PROXY_BOUNDARY=true
      - ACESTEP_PROXY_BIND_ADDRESS=${ACESTEP_DOCKER_BIND_ADDRESS:-127.0.0.1}
      - TOKENIZERS_PARALLELISM=false

    # ---- Ports ----
    ports:
      - "${ACESTEP_DOCKER_BIND_ADDRESS:-127.0.0.1}:${GRADIO_PORT:-7860}:7860"
      - "${ACESTEP_DOCKER_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8001}:8001"

    # ---- Persistent volumes ----
    volumes:
      - ./checkpoints:/app/checkpoints
      - hf_cache:/root/.cache/huggingface
      - ./gradio_outputs:/app/gradio_outputs
      - ./output:/app/output

    # ---- Shared memory for PyTorch DataLoader ----
    shm_size: "2gb"

    restart: unless-stopped

    healthcheck:
      test: >-
        curl -sf http://localhost:7860/ > /dev/null 2>&1 ||
        curl -sf http://localhost:8001/health > /dev/null 2>&1 ||
        exit 1
      interval: 30s
      timeout: 10s
      start_period: 300s
      retries: 3

volumes:
  hf_cache:
